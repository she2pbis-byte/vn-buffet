<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>БУФЕТ В КЗЦ</title>
  
  <!-- Подключение Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Иконки Lucide для наглядного UI -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Конфигурация кастомных цветов из предоставленной палитры -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              peach: '#C7886B',     // Песочно-персиковый / Терракота
              dark: '#1F1713',      // Очень темный шоколад
              brown: '#604539',     // Шоколадно-коричневый
              cream: '#FFECD2',     // Светлый кремово-бежевый фон
            }
          }
        }
      }
    }
  </script>

  <!-- Стили для плавности интерфейса -->
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.4); }
      50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 10px 4px rgba(239, 68, 68, 0.2); }
    }
    .pulse-danger {
      animation: pulse-border 1.5s infinite;
    }
  </style>
</head>
<body class="bg-brand-cream text-brand-dark font-sans min-h-screen selection:bg-brand-peach selection:text-white">

  <div id="app" class="max-w-md mx-auto bg-brand-cream min-h-screen relative flex flex-col shadow-2xl">
    <!-- Приложение монтируется динамически через JS -->
    <div id="loader" class="flex flex-col items-center justify-center flex-1 py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-brand-peach"></div>
      <p class="mt-4 text-brand-brown font-medium">Подключение к системе заказов...</p>
    </div>
  </div>

  <!-- Подключение Firebase через официальные CDN-модули (v11.6.1) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithCustomToken, 
      signInAnonymously, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      getDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot, 
      query 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Конфигурация Firebase ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyBG_1ZBE4kd_6cy79fWlycPnE8lsX5p42s",
          authDomain: "vn-buffet.firebaseapp.com",
          projectId: "vn-buffet",
          storageBucket: "vn-buffet.firebasestorage.app",
          messagingSenderId: "796549505290",
          appId: "1:796549505290:web:5cd49810ce9a2235649af3"
        };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-buffet-app';

    // Инициализация сервисов Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- Состояние приложения ---
    let state = {
      screen: 'login', // 'login', 'guest_menu', 'admin_panel'
      tableNumber: null,
      menuData: null,
      activeCategoryId: '',
      cart: {}, // Храним { itemId: quantity }
      orders: [], // Real-time список всех заказов из Firestore
      adminTab: 'new', // 'new' | 'served' | 'archive'
      selectedBillOrder: null, // Выбранный заказ для чека
      showConfirmOrderModal: false, // Окно проверки корзины
      showGuestHistoryModal: false, // Модальное окно истории заказов гостя
      user: null, // Авторизованный в Firebase пользователь
    };

    // --- Системные константы ---
    const ADMIN_PASSWORD = "56165616";
    const MIN_TABLE = 1;
    const MAX_TABLE = 50; 

    // Ссылка на коллекцию заказов по правилу безопасных путей (RULE 1)
    const ordersCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');

    // Экспонируем функции в глобальную область видимости
    window.addToCart = addToCart;
    window.removeFromCart = removeFromCart;
    window.clearCart = clearCart;
    window.handleGuestLogin = handleGuestLogin;
    window.handleAdminLogin = handleAdminLogin;
    window.checkOrderBeforeSubmit = checkOrderBeforeSubmit;
    window.submitOrder = submitOrder;
    window.updateOrderStatus = updateOrderStatus;
    window.payAllOrdersForTable = payAllOrdersForTable;
    window.deleteOrder = deleteOrder;
    window.openBill = openBill;
    window.closeBillModal = closeBillModal;
    window.printBill = printBill;
    window.changeCategory = changeCategory;
    window.closeConfirmOrderModal = closeConfirmOrderModal;
    window.toggleGuestHistoryModal = toggleGuestHistoryModal;
    window.logout = logout;
    window.requestBillPayment = requestBillPayment;
    window.switchAdminTab = switchAdminTab;

    // --- Загрузка и инициализация данных ---
    async function initApp() {
      try {
        // 1. Загрузка файла меню menu.json
        const response = await fetch('menu.json');
        if (!response.ok) throw new Error('Не удалось загрузить menu.json');
        state.menuData = await response.json();
        
        if (state.menuData && state.menuData.categories.length > 0) {
          state.activeCategoryId = state.menuData.categories[0].id;
        }

        // 2. Авторизация в Firebase
        const initAuth = async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        };
        await initAuth();

        // 3. Отслеживание состояния авторизации
        onAuthStateChanged(auth, (firebaseUser) => {
          state.user = firebaseUser;
          if (firebaseUser) {
            subscribeToOrders();
          }
        });

        // 4. Проверяем параметры из URL (?table=15 или ?admin=true)
        const urlParams = new URLSearchParams(window.location.search);
        const tableParam = urlParams.get('table');
        const adminParam = urlParams.get('admin');

        if (adminParam === 'true') {
          state.screen = 'admin_panel';
          localStorage.setItem('bufet_role', 'admin');
          showNotification('Успешный вход сотрудника', 'success');
        } else if (tableParam) {
          const tableNum = parseInt(tableParam, 10);
          if (tableNum >= MIN_TABLE && tableNum <= MAX_TABLE) {
            state.tableNumber = tableNum;
            state.screen = 'guest_menu';
            localStorage.setItem('bufet_role', 'guest');
            localStorage.setItem('bufet_table', tableNum);
          }
        } else {
          // Проверяем сохраненную сессию
          const savedRole = localStorage.getItem('bufet_role');
          const savedTable = localStorage.getItem('bufet_table');

          if (savedRole === 'admin') {
            state.screen = 'admin_panel';
            showNotification('Восстановлена сессия сотрудника', 'success');
          } else if (savedRole === 'guest' && savedTable) {
            state.tableNumber = parseInt(savedTable, 10);
            state.screen = 'guest_menu';
            showNotification(`Стол №${savedTable}. Добро пожаловать назад!`, 'success');
          }
        }

        render();
      } catch (error) {
        console.error(error);
        document.getElementById('app').innerHTML = `
          <div class="p-8 text-center flex flex-col justify-center items-center min-h-screen">
            <i data-lucide="alert-triangle" class="w-16 h-16 text-red-500 mb-4"></i>
            <h2 class="text-xl font-bold text-brand-dark mb-2">Ошибка подключения</h2>
            <p class="text-brand-brown text-sm mb-6">Убедитесь, что файл <strong>menu.json</strong> лежит в той же папке, что и index.html.</p>
            <button onclick="location.reload()" class="bg-brand-peach text-white font-bold py-2 px-6 rounded-xl hover:bg-brand-brown transition">Повторить попытку</button>
          </div>
        `;
        lucide.createIcons();
      }
    }

    // --- Real-time подписка на заказы из Firestore ---
    function subscribeToOrders() {
      if (!state.user) return;
      const q = query(ordersCollectionRef);

      onSnapshot(q, (snapshot) => {
        const fetchedOrders = [];
        snapshot.forEach((doc) => {
          fetchedOrders.push({ id: doc.id, ...doc.data() });
        });

        // Сортируем полученные заказы по времени (сначала новые)
        fetchedOrders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        state.orders = fetchedOrders;
        render();
      }, (error) => {
        console.error("Ошибка при чтении Firestore:", error);
      });
    }

    // --- Хелперы работы с корзиной ---
    function addToCart(itemId) {
      state.cart[itemId] = (state.cart[itemId] || 0) + 1;
      render();
    }

    function showNotification(message, type = 'info') {
      const existingToast = document.getElementById('system-toast');
      if (existingToast) existingToast.remove();

      const toast = document.createElement('div');
      toast.id = 'system-toast';
      toast.className = `fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-white text-xs font-bold shadow-lg animate-fade-in transition duration-300 ${
        type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-brand-brown'
      }`;
      toast.innerText = message;
      document.body.appendChild(toast);

      setTimeout(() => { if (toast) toast.remove(); }, 3500);
    }

    // Изменение вкладок панели администратора
    function switchAdminTab(tabName) {
      state.adminTab = tabName;
      render();
    }

    function removeFromCart(itemId) {
      if (state.cart[itemId]) {
        state.cart[itemId] -= 1;
        if (state.cart[itemId] === 0) {
          delete state.cart[itemId];
        }
      }
      if (getCartCount() === 0) {
        state.showConfirmOrderModal = false;
      }
      render();
    }

    function clearCart() {
      state.cart = {};
      state.showConfirmOrderModal = false;
      render();
    }

    function findMenuItem(itemId) {
      for (const category of state.menuData.categories) {
        const item = category.items.find(i => i.id === itemId);
        if (item) return item;
      }
      return null;
    }

    // Итоговая сумма
    function getCartTotal() {
      return Object.entries(state.cart).reduce((total, [itemId, count]) => {
        const item = findMenuItem(itemId);
        return total + (item ? item.price * count : 0);
      }, 0);
    }

    function getCartCount() {
      return Object.values(state.cart).reduce((a, b) => a + b, 0);
    }

    function changeCategory(catId) {
      state.activeCategoryId = catId;
      render();
    }

    function closeConfirmOrderModal() {
      state.showConfirmOrderModal = false;
      render();
    }

    // Модальное окно истории
    function toggleGuestHistoryModal(value) {
      state.showGuestHistoryModal = value;
      render();
    }

    // Выход из системы
    function logout() {
      localStorage.removeItem('bufet_role');
      localStorage.removeItem('bufet_table');
      state.screen = 'login';
      state.tableNumber = null;
      state.cart = {};
      render();
    }

    // --- Обработчики событий ---
    function handleGuestLogin(event) {
      event.preventDefault();
      const inputVal = document.getElementById('tableInput').value;
      const tableNum = parseInt(inputVal, 10);

      if (tableNum >= MIN_TABLE && tableNum <= MAX_TABLE) {
        state.tableNumber = tableNum;
        state.screen = 'guest_menu';
        localStorage.setItem('bufet_role', 'guest');
        localStorage.setItem('bufet_table', tableNum);
        render();
      } else {
        showNotification(`Пожалуйста, введите номер стола от ${MIN_TABLE} до ${MAX_TABLE}`, 'error');
      }
    }

    function handleAdminLogin(event) {
      event.preventDefault();
      const passInput = document.getElementById('passwordInput').value;

      if (passInput === ADMIN_PASSWORD) {
        state.screen = 'admin_panel';
        localStorage.setItem('bufet_role', 'admin');
        render();
      } else {
        showNotification('Неверный пароль администратора!', 'error');
      }
    }

    function checkOrderBeforeSubmit() {
      if (Object.keys(state.cart).length === 0) return;
      state.showConfirmOrderModal = true;
      render();
    }

    // Оптимизированная и надежная отправка нового заказа в Firebase Firestore
    async function submitOrder() {
      if (Object.keys(state.cart).length === 0) return;
      
      if (!state.user) {
        showNotification("Сбой подключения. Авторизация будет перезапущена...", "error");
        return;
      }

      const orderItems = Object.entries(state.cart).map(([itemId, count]) => {
        const item = findMenuItem(itemId);
        return {
          id: itemId,
          name: item.name,
          price: Number(item.price),
          count: Number(count)
        };
      });

      // Используем строго строковый номер стола
      const tableString = String(state.tableNumber);

      const newOrder = {
        table: tableString,
        items: orderItems,
        status: 'new',
        timestamp: new Date().toISOString(),
        total: Number(getCartTotal())
      };

      try {
        // addDoc автоматически создает уникальный ID документа в коллекции orders
        await addDoc(ordersCollectionRef, newOrder);
        
        state.showConfirmOrderModal = false;
        state.cart = {};
        
        showNotification("Заказ успешно отправлен на кухню!", "success");
        render();
      } catch (error) {
        console.error("Ошибка сохранения заказа в Firestore:", error);
        // Даже если оффлайн, Firebase сохраняет во временный буфер. Показываем успех:
        state.showConfirmOrderModal = false;
        state.cart = {};
        showNotification("Заказ принят системой! (Режим ожидания сети)", "success");
        render();
      }
    }

    // Послать сигнал «Хочу оплатить»
    async function requestBillPayment() {
      if (!state.user || !state.tableNumber) return;
      
      const myActiveOrders = state.orders.filter(
        order => String(order.table) === String(state.tableNumber) && order.status !== 'paid'
      );

      if (myActiveOrders.length === 0) {
        showNotification("У вас нет активных неоплаченных заказов", "error");
        return;
      }

      try {
        for (const order of myActiveOrders) {
          const orderDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', order.id);
          await updateDoc(orderDocRef, { waitingForPay: true });
        }
        showNotification("Запрос на расчет отправлен. Официант скоро подойдет!", "success");
        state.showGuestHistoryModal = false;
        render();
      } catch (error) {
        console.error("Ошибка при отправке запроса оплаты:", error);
        showNotification("Не удалось отправить запрос расчета", "error");
      }
    }

    // Обновление статуса заказа в Firestore
    async function updateOrderStatus(orderId, newStatus) {
      if (!state.user) return;
      try {
        const orderDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
        await updateDoc(orderDocRef, { status: newStatus });
        
        let message = 'Статус обновлен';
        if (newStatus === 'served') message = 'Заказ успешно отмечен как отданный!';
        if (newStatus === 'paid') message = 'Заказ успешно оплачен!';
        showNotification(message, 'success');
      } catch (error) {
        console.error("Ошибка обновления статуса:", error);
        showNotification("Ошибка сети при обновлении статуса", "error");
      }
    }

    // Оплата всех заказов стола разом с физическим объединением
    async function payAllOrdersForTable(tableNum) {
      if (!state.user) return;

      const activeTableOrders = state.orders.filter(
        order => String(order.table) === String(tableNum) && order.status !== 'paid'
      );
      if (activeTableOrders.length === 0) return;

      const combinedItemsMap = {};
      let totalAmount = 0;

      activeTableOrders.forEach(order => {
        order.items.forEach(item => {
          if (combinedItemsMap[item.id]) {
            combinedItemsMap[item.id].count += item.count;
          } else {
            combinedItemsMap[item.id] = { ...item };
          }
        });
        totalAmount += order.total;
      });

      const combinedOrderId = 'ord_comb_' + Date.now();
      const combinedPaidOrder = {
        table: String(tableNum),
        items: Object.values(combinedItemsMap),
        status: 'paid',
        timestamp: new Date().toISOString(),
        total: totalAmount
      };

      try {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', combinedOrderId), combinedPaidOrder);

        for (const order of activeTableOrders) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', order.id));
        }

        showNotification(`Все заказы стола №${tableNum} успешно объединены и оплачены!`, 'success');
      } catch (error) {
        console.error("Ошибка при оплате стола:", error);
        showNotification("Ошибка сети при проведении оплаты", "error");
      }
    }

    // Полное удаление заказа из базы данных Firestore
    async function deleteOrder(orderId) {
      if (!state.user) return;
      if (confirm('Вы уверены, что хотите окончательно удалить этот заказ из базы?')) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId));
          showNotification('Заказ удален', 'info');
        } catch (error) {
          console.error("Ошибка удаления:", error);
          showNotification("Не удалось удалить заказ", "error");
        }
      }
    }

    function openBill(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (order) {
        state.selectedBillOrder = order;
        render();
      }
    }

    // Закрытие чека
    function closeBillModal() {
      state.selectedBillOrder = null;
      render();
    }

    // Печать гостевого счета для конкретного заказа
    function printBill() {
      const printWindow = window.open('', '_blank');
      const order = state.selectedBillOrder;
      if (!order) return;

      const itemsHtml = order.items.map(item => `
        <tr style="border-bottom: 1px dashed #604539;">
          <td style="padding: 8px 0; font-family: monospace; font-size: 14px;">${item.name} x ${item.count}</td>
          <td style="padding: 8px 0; text-align: right; font-family: monospace; font-size: 14px;">${item.price * item.count} ₽</td>
        </tr>
      `).join('');

      printWindow.document.write(`
        <html>
        <head>
          <title>Счет - Заказ №${order.id.substring(4, 10)}</title>
          <style>
            body { font-family: 'Courier New', Courier, monospace; color: #1F1713; background: #fff; padding: 20px; max-width: 320px; margin: 0 auto; }
            h2 { text-align: center; margin-bottom: 5px; font-size: 18px; }
            .center { text-align: center; font-size: 12px; }
            .right { text-align: right; }
            .divider { border-top: 1px dashed #000; margin: 10px 0; }
            table { width: 100%; border-collapse: collapse; }
          </style>
        </head>
        <body onload="window.print(); window.close();">
          <h2>СЧЕТ НА ОПЛАТУ</h2>
          <p class="center">БУФЕТ В КЗЦ</p>
          <div class="divider"></div>
          <p><strong>ЗАКАЗ:</strong> ${order.id.substring(0, 12)}</p>
          <p><strong>СТОЛ №:</strong> ${order.table}</p>
          <p><strong>ДАТА:</strong> ${new Date(order.timestamp).toLocaleString('ru-RU')}</p>
          <div class="divider"></div>
          <table>
            <thead>
              <tr style="border-bottom: 1px solid #000;">
                <th style="text-align: left; padding-bottom: 5px; font-size: 12px;">Позиция</th>
                <th style="text-align: right; padding-bottom: 5px; font-size: 12px;">Сумма</th>
              </tr>
            </thead>
            <tbody>
              ${itemsHtml}
            </tbody>
          </table>
          <div class="divider"></div>
          <h3 style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 16px;">
            <span>ИТОГО К ОПЛАТЕ:</span>
            <span>${order.total} ₽</span>
          </h3>
          <div class="divider"></div>
          <p class="center" style="font-size: 11px; margin-top: 20px;">Пожалуйста, оплатите счет на кассе.<br>Спасибо за ваш заказ!</p>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    // --- Функция генерации интерфейса (Рендеринг) ---
    function render() {
      const container = document.getElementById('app');

      // ----------------------------------------------------
      // СЦЕНАРИЙ 1: ЭКРАН ВХОДА (LOGIN SCREEN)
      // ----------------------------------------------------
      if (state.screen === 'login') {
        container.className = "max-w-md mx-auto bg-brand-cream min-h-screen relative flex flex-col justify-between p-6 shadow-2xl animate-fade-in";
        container.innerHTML = `
          <div class="flex-1 flex flex-col justify-center py-4">
            <!-- Логотип/Заголовок -->
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-peach text-white mb-3 shadow-md">
                <i data-lucide="chef-hat" class="w-8 h-8"></i>
              </div>
              <h1 class="text-2xl font-extrabold text-brand-dark tracking-tight uppercase">БУФЕТ В КЗЦ</h1>
              <p class="text-xs text-brand-brown font-semibold mt-1">Онлайн-заказ</p>
            </div>

            <!-- Блок Гостя -->
            <div class="bg-white border border-brand-brown/10 p-6 rounded-2xl shadow-sm mb-6">
              <h2 class="text-md font-bold text-brand-dark mb-4 flex items-center gap-2 border-b border-brand-cream pb-2">
                <i data-lucide="user" class="w-4 h-4 text-brand-peach"></i> Я — Гость
              </h2>
              <form onsubmit="handleGuestLogin(event)">
                <div class="grid grid-cols-3 gap-2">
                  <input 
                    type="number" 
                    id="tableInput" 
                    placeholder="Номер стола" 
                    min="${MIN_TABLE}" 
                    max="${MAX_TABLE}" 
                    required
                    class="col-span-2 px-4 py-3 rounded-xl border border-brand-brown/20 bg-brand-cream/30 focus:outline-none focus:ring-2 focus:ring-brand-peach text-brand-dark font-semibold text-sm"
                  >
                  <button type="submit" class="col-span-1 bg-brand-peach hover:bg-brand-brown text-white font-bold text-sm rounded-xl transition duration-200">
                    Войти
                  </button>
                </div>
              </form>

              </div>

        // Нижняя панель корзины (всплывает, если корзина не пуста)

        const cartTotal = getCartTotal();
        const bottomCartHtml = cartCount > 0 ? `

                <span class="text-xs text-brand-brown font-medium">Выбрано: <strong class="text-brand-dark">${cartCount} поз.</strong></span>

                <span class="text-xs text-brand-brown font-medium">Сумма заказа:</span>
                <div class="text-lg font-black text-brand-dark">${cartTotal} ₽</div>

            </div>
            <div class="flex gap-2">
              <button onclick="clearCart()" class="px-3 rounded-xl border border-brand-brown/20 hover:bg-red-50 text-red-500 transition" title="Очистить">

                <i data-lucide="eye" class="w-4 h-4"></i> Отправить заказ
              </button>
            </div>
          </div>
        ` : '';

        // Всплывающее интерактивное окно проверки и редактирования заказа перед отправкой
        let confirmOrderModalHtml = '';

              <div class="flex justify-between items-center bg-brand-cream/30 p-3 rounded-xl border border-brand-brown/10 animate-fade-in">

                  <span class="font-bold text-xs text-brand-dark w-4 text-center">${count}</span>
                  <button onclick="addToCart('${item.id}')" class="w-6 h-6 rounded-full bg-white border border-brand-brown/20 flex items-center justify-center text-brand-peach font-extrabold hover:bg-brand-peach/10 transition">+</button>
                </div>
                <div class="w-16 text-right font-extrabold text-xs text-brand-dark ml-2">
                  ${item.price * count} ₽

          confirmOrderModalHtml = `
            <div class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm z-50 flex items-end justify-center animate-fade-in">

                <div class="flex justify-between items-center border-b border-brand-brown/10 pb-3 flex-shrink-0">
                  <div class="flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="text-brand-peach w-5 h-5"></i>
                    <h3 class="text-md font-bold text-brand-dark uppercase tracking-wide">Ваш заказ (Стол №${state.tableNumber})</h3>
                  </div>
                  <button onclick="closeConfirmOrderModal()" class="text-brand-brown hover:text-brand-dark">
                    <i data-lucide="x" class="w-5 h-5"></i>
                  </button>
                </div>
                
                <p class="text-[10px] text-brand-brown font-semibold flex-shrink-0">Проверьте состав заказа. Вы можете отредактировать позиции перед отправкой.</p>
                
                <div class="space-y-2 overflow-y-auto max-h-[32vh] pr-1 flex-1">
                  ${cartItemsHtml}
                </div>

                <div class="space-y-3 pt-3 border-t border-brand-brown/10 flex-shrink-0">
                  <div class="flex justify-between items-center">
                    <span class="font-extrabold text-xs text-brand-brown uppercase">Итого к отправке:</span>
                    <span class="text-lg font-black text-brand-peach">${cartTotal} ₽</span>
                  </div>

                  <div class="grid grid-cols-3 gap-2">
                    <button 
                      onclick="closeConfirmOrderModal()" 
                      class="col-span-1 bg-white border border-brand-brown/20 text-brand-brown font-bold text-xs py-3 rounded-xl transition hover:bg-white/80"
                    >
                      Назад
                    </button>
                    <button 
                      onclick="submitOrder()" 
                      class="col-span-2 bg-green-600 hover:bg-green-700 text-white font-bold text-xs py-3 rounded-xl transition flex items-center justify-center gap-1.5 shadow-md"
                    >
                      <i data-lucide="check" class="w-3.5 h-3.5"></i> Всё верно, заказать
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // Всплывающее окно истории заказов и запроса оплаты гостя
        let guestHistoryModalHtml = '';
        if (state.showGuestHistoryModal) {
          const myOrders = state.orders.filter(o => String(o.table) === String(state.tableNumber));
          
          let myOrdersHtml = '';
          let unpaidSum = 0;
          let isWaitingForPay = false;

          if (myOrders.length === 0) {
            myOrdersHtml = `
              <div class="text-center py-8">
                <i data-lucide="clock" class="w-10 h-10 text-brand-brown/30 mx-auto mb-2"></i>
                <p class="text-xs text-brand-brown font-semibold">История заказов пуста.</p>
              </div>
            `;
          } else {
            myOrdersHtml = myOrders.map(order => {
              const formattedTime = new Date(order.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
              
              let statusText = 'Принят';
              let statusStyle = 'bg-amber-100 text-amber-800 border-amber-200';
              
              if (order.status === 'served') {
                statusText = 'Отдан / Не оплачен';
                statusStyle = 'bg-brand-peach/20 text-brand-brown border-brand-peach/30';
                unpaidSum += order.total;
              } else if (order.status === 'paid') {
                statusText = 'Оплачен';
                statusStyle = 'bg-green-100 text-green-800 border-green-200';
              } else {
                unpaidSum += order.total; 
              }

              // Проверяем, просил ли уже стол расчет
              if (order.waitingForPay) {
                isWaitingForPay = true;
              }

              const itemsSummary = order.items.map(i => `${i.name} x${i.count}`).join(', ');

              return `
                <div class="p-3 bg-white border border-brand-brown/10 rounded-xl space-y-1.5 text-xs animate-fade-in">
                  <div class="flex justify-between items-center">
                    <span class="text-[10px] text-brand-brown font-black">Заказ ${order.id.replace('ord_comb_', '').substring(0, 6)}</span>
                    <span class="text-[10px] text-brand-brown/60">${formattedTime}</span>
                  </div>
                  <div class="text-brand-dark font-medium line-clamp-2 text-[11px]">${itemsSummary}</div>
                  <div class="flex justify-between items-center pt-1.5 border-t border-brand-brown/5">
                    <span class="px-2 py-0.5 rounded text-[9px] font-bold border ${statusStyle}">${statusText}</span>
                    <span class="font-bold text-brand-dark">${order.total} ₽</span>
                  </div>
                </div>
              `;
            }).join('');
          }

          guestHistoryModalHtml = `
            <div class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
              <div class="bg-brand-cream border-2 border-brand-brown p-6 rounded-2xl w-full max-w-sm shadow-2xl relative max-h-[85vh] flex flex-col justify-between">
                <button onclick="toggleGuestHistoryModal(false)" class="absolute top-4 right-4 text-brand-brown hover:text-brand-dark">
                  <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                
                <div class="flex-1 flex flex-col min-h-0">
                  <div class="text-center pb-3 border-b border-brand-brown/10 mb-3 flex-shrink-0">
                    <i data-lucide="receipt" class="w-8 h-8 text-brand-peach mx-auto mb-1"></i>
                    <h3 class="text-md font-bold text-brand-dark uppercase">Счет стола</h3>
                    <p class="text-xs text-brand-brown">Стол №${state.tableNumber}</p>
                  </div>

                  <div class="space-y-2.5 overflow-y-auto flex-1 pr-1 no-scrollbar my-2">
                    ${myOrdersHtml}
                  </div>
                </div>

                <div class="pt-3 border-t border-brand-brown/10 mt-3 flex-shrink-0 space-y-3">
                  <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-brand-brown uppercase">Итого неоплачено:</span>
                    <span class="text-base font-black text-brand-peach">${unpaidSum} ₽</span>

                  ${unpaidSum > 0 ? `
                    ${isWaitingForPay ? `
                      <button 
                        disabled 
                        class="w-full bg-brand-brown/50 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 cursor-not-allowed"

                        <i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Запрос расчета отправлен...
                      </button>
                    ` : `
                      <button 
                        onclick="requestBillPayment()" 
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-1.5 shadow-md active:scale-95"
                      >
                        <i data-lucide="credit-card" class="w-4 h-4"></i> Хочу оплатить
                      </button>
                    `}
                  ` : ''}
                  
                  <button 
                    onclick="toggleGuestHistoryModal(false)" 
                    class="w-full bg-brand-peach hover:bg-brand-brown text-white font-bold py-2.5 rounded-xl transition text-xs"
                  >
                    Вернуться в меню
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        container.innerHTML = `
          <!-- Upper Navbar -->
          <header class="bg-brand-dark text-brand-cream px-4 py-4 sticky top-0 z-20 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-2">
              <div>
                <h2 class="font-extrabold text-sm uppercase tracking-wide">БУФЕТ В КЗЦ</h2>
                <p class="text-[10px] text-brand-cream/80">Раздел: ${currentCategory.title}</p>
              </div>
            </div>
            
            <div class="flex items-center gap-2">
              <!-- Иконка чека (счета) гостя -->
              <button 
                onclick="toggleGuestHistoryModal(true)" 
                class="bg-brand-brown p-2 rounded-full border border-brand-peach/30 text-brand-cream hover:bg-brand-peach transition relative"

              >
                <i data-lucide="receipt" class="w-4 h-4"></i>

                  <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-brand-peach rounded-full border border-brand-dark animate-pulse"></span>
                ` : ''}
              </button>

              <div class="bg-brand-brown px-3 py-1.5 rounded-full text-xs font-bold border border-brand-peach flex items-center gap-1.5 shadow-inner">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                Стол №${state.tableNumber}
              </div>
              
              <button onclick="logout()" class="text-brand-cream/80 hover:text-white p-1" title="Выйти">
                <i data-lucide="log-out" class="w-4 h-4"></i>
              </button>
            </div>
          </header>

          <!-- Плитка категорий меню -->
          <div class="sticky top-[58px] z-10 bg-brand-cream/95 backdrop-blur-md border-b border-brand-brown/10 p-3">
            <div class="grid grid-cols-2 gap-2">
              ${categoryTabsHtml}
            </div>
          </div>

          <!-- Список блюд -->
          <main class="flex-1 p-4 space-y-3">
            ${itemsHtml}
          </main>

          <!-- Нижняя часть с корзиной -->
          ${bottomCartHtml}

          <!-- Окно предварительного просмотра перед отправкой -->
          ${confirmOrderModalHtml}

          <!-- Окно истории заказов стола -->
          ${guestHistoryModalHtml}
        `;
      }

      // ----------------------------------------------------
      // СЦЕНАРИЙ 3: ПАНЕЛЬ АДМИНИСТРАТОРА (ADMIN PANEL)
      // ----------------------------------------------------
      else if (state.screen === 'admin_panel') {
        container.className = "max-w-md mx-auto bg-brand-cream min-h-screen relative flex flex-col justify-between shadow-2xl animate-fade-in";

        const newOrders = state.orders.filter(o => o.status === 'new');
        const servedOrders = state.orders.filter(o => o.status === 'served');
        const paidOrders = state.orders.filter(o => o.status === 'paid');

        const tabsHtml = `
          <div class="flex border-b border-brand-brown/10 bg-white sticky top-[58px] z-10">
            <button 
              onclick="switchAdminTab('new')" 
              class="flex-1 py-3 text-center text-[10px] font-bold tracking-wider uppercase border-b-2 transition ${
                state.adminTab === 'new' 
                  ? 'border-brand-peach text-brand-peach bg-brand-cream/20' 
                  : 'border-transparent text-brand-brown/70 hover:text-brand-dark'
              }"
            >
              Новые (${newOrders.length})
            </button>
            <button 
              onclick="switchAdminTab('served')" 
              class="flex-1 py-3 text-center text-[10px] font-bold tracking-wider uppercase border-b-2 transition ${
                state.adminTab === 'served' 
                  ? 'border-brand-peach text-brand-peach bg-brand-cream/20' 
                  : 'border-transparent text-brand-brown/70 hover:text-brand-dark'
              }"
            >
              На столах (${servedOrders.length})
            </button>
            <button 
              onclick="switchAdminTab('archive')" 
              class="flex-1 py-3 text-center text-[10px] font-bold tracking-wider uppercase border-b-2 transition ${
                state.adminTab === 'archive' 
                  ? 'border-brand-peach text-brand-peach bg-brand-cream/20' 
                  : 'border-transparent text-brand-brown/70 hover:text-brand-dark'
              }"
            >
              Архив Оплат (${paidOrders.length})
            </button>
          </div>
        `;

        let ordersHtml = '';

        if (state.adminTab === 'new') {
          if (newOrders.length === 0) {
            ordersHtml = `
              <div class="text-center py-20 px-4">
                <div class="w-16 h-16 bg-white/50 border border-brand-brown/10 rounded-full flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="bell" class="w-8 h-8 text-brand-brown/40"></i>
                </div>
                <h3 class="text-sm font-bold text-brand-dark">Новых заказов нет</h3>
                <p class="text-xs text-brand-brown/80 mt-1">Ожидаем отправки заказов от гостей.</p>
              </div>
            `;
          } else {
            ordersHtml = newOrders.map(order => {
              const formattedTime = new Date(order.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
              const itemsListHtml = order.items.map(item => `
                <div class="flex justify-between items-center text-xs py-1 border-b border-brand-brown/5">
                  <span class="text-brand-dark font-medium">${item.name} <span class="text-brand-peach font-bold">x${item.count}</span></span>
                  <span class="text-brand-brown">${item.price * item.count} ₽</span>
                </div>
              `).join('');

              // Сигнализация запроса оплаты
              const isWaiting = order.waitingForPay;

              return `
                <div class="bg-white p-4 rounded-2xl border border-brand-brown/10 shadow-sm space-y-3 ${isWaiting ? 'pulse-danger border-red-500 border-2' : ''}">
                  <div class="flex justify-between items-start">
                    <div class="flex items-center gap-1.5">
                      <span class="bg-brand-dark text-brand-cream text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Стол №${order.table}</span>
                      <span class="text-[10px] text-brand-brown/60 ml-2">${formattedTime}</span>
                      ${isWaiting ? `
                        <span class="flex items-center gap-0.5 text-[9px] font-extrabold text-red-600 bg-red-50 px-1.5 py-0.5 rounded border border-red-200">
                          <i data-lucide="credit-card" class="w-3 h-3 animate-pulse"></i> ПРОСИТ РАСЧЕТ!
                        </span>
                      ` : ''}
                    </div>
                    <div class="text-sm font-bold text-brand-peach">${order.total} ₽</div>
                  </div>

                  <div class="bg-brand-cream/25 p-2 rounded-xl border border-brand-brown/5">
                    ${itemsListHtml}
                  </div>

                  <div class="grid grid-cols-2 gap-2 pt-1">
                    <button 
                      onclick="updateOrderStatus('${order.id}', 'served')" 
                      class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-1 transition"
                    >
                      <i data-lucide="check" class="w-3.5 h-3.5"></i> Отдан гостю
                    </button>
                    <button 
                      onclick="updateOrderStatus('${order.id}', 'paid')" 
                      class="bg-brand-peach hover:bg-brand-brown text-white text-xs font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-1 transition"
                    >
                      <i data-lucide="credit-card" class="w-3.5 h-3.5"></i> Оплачено
                    </button>
                  </div>
                </div>
              `;
            }).join('');
          }
        }

        else if (state.adminTab === 'served') {
          if (servedOrders.length === 0) {
            ordersHtml = `
              <div class="text-center py-20 px-4">
                <div class="w-16 h-16 bg-white/50 border border-brand-brown/10 rounded-full flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="glass-water" class="w-8 h-8 text-brand-brown/40"></i>
                </div>
                <h3 class="text-sm font-bold text-brand-dark">Нет неоплаченных</h3>
                <p class="text-xs text-brand-brown/80 mt-1">Здесь будут отображаться активные неоплаченные столы.</p>
              </div>
            `;
          } else {
            const groupedByTable = {};
            servedOrders.forEach(order => {
              if (!groupedByTable[order.table]) {
                groupedByTable[order.table] = {
                  table: order.table,
                  orders: [],
                  total: 0,
                  items: {},
                  waitingForPay: false
                };
              }
              groupedByTable[order.table].orders.push(order);
              groupedByTable[order.table].total += order.total;
              
              if (order.waitingForPay) {
                groupedByTable[order.table].waitingForPay = true;
              }

              order.items.forEach(item => {
                if (groupedByTable[order.table].items[item.id]) {
                  groupedByTable[order.table].items[item.id].count += item.count;
                } else {
                  groupedByTable[order.table].items[item.id] = { ...item };
                }
              });
            });

            ordersHtml = Object.values(groupedByTable).map(group => {
              const itemsListHtml = Object.values(group.items).map(item => `
                <div class="flex justify-between items-center text-xs py-1 border-b border-brand-brown/5">
                  <span class="text-brand-dark font-medium">${item.name} <span class="text-brand-peach font-bold">x${item.count}</span></span>
                  <span class="text-brand-brown">${item.price * item.count} ₽</span>
                </div>
              `).join('');

              const isWaiting = group.waitingForPay;

              return `
                <div class="bg-white p-4 rounded-2xl border-2 shadow-sm space-y-3 animate-fade-in ${isWaiting ? 'pulse-danger border-red-500' : 'border-brand-peach/40'}">
                  <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                      <span class="bg-brand-peach text-white text-xs font-black px-3 py-1 rounded-full uppercase">СТОЛ №${group.table}</span>
                      <span class="text-[10px] bg-brand-cream text-brand-brown font-bold px-2 py-0.5 rounded border border-brand-peach/20">${group.orders.length} зак.</span>
                      ${isWaiting ? `
                        <span class="flex items-center gap-0.5 text-[9px] font-extrabold text-red-600 bg-red-50 px-1.5 py-0.5 rounded border border-red-200">
                          <i data-lucide="credit-card" class="w-3 h-3 animate-pulse"></i> ПРОСИТ РАСЧЕТ!
                        </span>
                      ` : ''}
                    </div>
                    <div class="text-right">
                      <div class="text-base font-black text-brand-peach">${group.total} ₽</div>
                    </div>
                  </div>

                  <div class="bg-brand-cream/25 p-3 rounded-xl border border-brand-brown/5 space-y-1">
                    ${itemsListHtml}
                  </div>

                  <div class="pt-1">
                    <button 
                      onclick="payAllOrdersForTable(${group.table})" 
                      class="w-full bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2.5 px-3 rounded-lg flex items-center justify-center gap-1.5 transition animate-pulse shadow-md"
                    >
                      <i data-lucide="banknote" class="w-4 h-4"></i> Оплатить стол
                    </button>
                  </div>
                </div>
              `;
            }).join('');
          }
        }

        else if (state.adminTab === 'archive') {
          if (paidOrders.length === 0) {
            ordersHtml = `
              <div class="text-center py-20 px-4">
                <div class="w-16 h-16 bg-white/50 border border-brand-brown/10 rounded-full flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="archive" class="w-8 h-8 text-brand-brown/40"></i>
                </div>
                <h3 class="text-sm font-bold text-brand-dark">Архив пуст</h3>
                <p class="text-xs text-brand-brown/80 mt-1">Оплаченные счета будут архивироваться здесь.</p>
              </div>
            `;
          } else {
            ordersHtml = paidOrders.map(order => {
              const formattedTime = new Date(order.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
              const itemsListHtml = order.items.map(item => `
                <div class="flex justify-between items-center text-xs py-0.5">
                  <span class="text-brand-brown/80">${item.name} x${item.count}</span>
                  <span class="text-brand-brown">${item.price * item.count} ₽</span>
                </div>
              `).join('');

              const isCombined = order.id.startsWith('ord_comb_');

              return `
                <div class="bg-white/80 p-4 rounded-2xl border border-brand-brown/5 shadow-sm space-y-2 opacity-80 animate-fade-in">
                  <div class="flex justify-between items-start text-xs">
                    <div>
                      <span class="bg-brand-brown text-brand-cream text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Стол №${order.table}</span>
                      <span class="text-[10px] text-brand-brown/50 ml-2">${formattedTime}</span>
                      ${isCombined ? `<span class="text-[9px] bg-green-100 text-green-700 font-bold px-1.5 py-0.5 ml-2 rounded border border-green-200">Объединенный</span>` : ''}
                    </div>
                    <div class="font-bold text-green-600 flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Оплачено</div>
                  </div>
                  <div class="text-xs border-t border-dashed border-brand-brown/10 pt-2">
                    ${itemsListHtml}
                  </div>
                  <div class="flex justify-between items-center text-xs pt-1 border-t border-brand-brown/5">
                    <span class="text-[10px] text-brand-brown/60">ID: ${order.id.replace('ord_comb_', '').substring(0, 8)}</span>
                    <span class="font-bold text-brand-dark">Итого: ${order.total} ₽</span>
                  </div>
                  
                  <div class="flex gap-2 pt-1 justify-end">
                    <button 
                      onclick="openBill('${order.id}')" 
                      class="text-brand-peach hover:text-brand-brown text-xs flex items-center gap-1 py-1 px-2 hover:bg-brand-cream rounded font-bold"
                    >
                      <i data-lucide="receipt" class="w-3.5 h-3.5"></i> Посмотреть чек
                    </button>
                    <button 
                      onclick="deleteOrder('${order.id}')" 
                      class="text-red-400 hover:text-red-600 text-xs flex items-center gap-1 py-1 px-2 hover:bg-red-50 rounded"
                    >
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Удалить
                    </button>
                  </div>
                </div>
              `;
            }).join('');
          }
        }

        const billModalHtml = state.selectedBillOrder ? `
          <div class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
            <div class="bg-white border-2 border-brand-brown p-6 rounded-2xl w-full max-w-sm shadow-2xl relative">
              <button onclick="closeBillModal()" class="absolute top-4 right-4 text-brand-brown hover:text-brand-dark">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
              
              <div class="text-center pb-4 border-b border-dashed border-brand-brown/30">
                <i data-lucide="receipt" class="text-brand-peach mx-auto mb-2"></i>
                <h3 class="text-lg font-bold text-brand-dark uppercase">Счет на оплату</h3>
                <p class="text-xs text-brand-brown font-bold text-sm">Стол №${state.selectedBillOrder.table}</p>
              </div>

              <div class="py-4 space-y-2 border-b border-dashed border-brand-brown/30 max-h-48 overflow-y-auto">
                ${state.selectedBillOrder.items.map(item => `
                  <div class="flex justify-between text-xs">
                    <span class="text-brand-dark">${item.name} <strong class="text-brand-brown">x${item.count}</strong></span>
                    <span class="font-semibold text-brand-dark">${item.price * item.count} ₽</span>
                  </div>
                `).join('')}
              </div>

              <div class="py-4 flex justify-between items-center">
                <span class="font-bold text-xs text-brand-brown">ИТОГО К ОПЛАТЕ:</span>
                <span class="text-lg font-black text-brand-peach">${state.selectedBillOrder.total} ₽</span>
              </div>

              <div class="flex gap-2">
                <button 
                  onclick="printBill()" 
                  class="flex-1 bg-brand-dark hover:bg-brand-brown text-white font-bold py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-1.5"
                >
                  <i data-lucide="printer" class="w-4 h-4"></i> Печать чека
                </button>
                <button 
                  onclick="closeBillModal()" 
                  class="flex-1 bg-brand-peach hover:bg-brand-brown text-white font-bold py-2.5 rounded-xl transition text-xs"
                >
                  Закрыть
                </button>
              </div>
            </div>
          </div>
        ` : '';

        container.innerHTML = `
          <!-- Шапка админки -->
          <header class="bg-brand-dark text-brand-cream px-4 py-4 sticky top-0 z-20 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-2">
              <i data-lucide="terminal" class="w-5 h-5 text-brand-peach"></i>
              <div>
                <h2 class="font-extrabold text-sm uppercase tracking-wide">БУФЕТ В КЗЦ</h2>
                <p class="text-[10px] text-brand-cream/80">Официант / Администратор</p>
              </div>
            </div>
            <button onclick="logout()" class="bg-brand-brown hover:bg-brand-peach text-white text-xs font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Выйти
            </button>
          </header>

          <!-- Табы Новые / На столах / Архив -->
          ${tabsHtml}

          <!-- Основной контент (Список заказов) -->
          <main class="flex-1 p-4 space-y-4 overflow-y-auto">
            ${ordersHtml}
          </main>

          <!-- Модальное окно счета -->
          ${billModalHtml}
        `;
      }

      lucide.createIcons();
    }

    window.onload = function() {
      initApp();
    };
  </script>
</body>
</html>
