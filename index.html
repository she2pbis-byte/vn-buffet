<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>БУФЕТ</title>
  
  <meta name="theme-color" content="#1F1713">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              peach: '#C7886B',     // Песочно-персиковый / Терракота
              dark: '#1F1713',      // Очень темный шоколад
              brown: '#604539',     // Шоколадно-коричневый
              cream: '#FFECD2',     // Светлый кремово-бежевый фон
            }
          }
        }
      }
    }
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.4); }
      50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 10px 4px rgba(239, 68, 68, 0.2); }
    }
    .pulse-danger {
      animation: pulse-border 1.5s infinite;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes slideInLeft {
      0% {
        transform: translateX(-100%);
        opacity: 0;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }
    @keyframes slideOutRight {
      0% {
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateX(100%);
        opacity: 0;
      }
    }
    .slide-in-left {
      animation: slideInLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-out-right {
      animation: slideOutRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-brand-cream text-brand-dark font-sans min-h-screen selection:bg-brand-peach selection:text-white">

  <div id="app" class="max-w-md mx-auto bg-brand-cream min-h-screen relative flex flex-col shadow-2xl">
    <div id="loader" class="flex flex-col items-center justify-center flex-1 py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-brand-peach"></div>
      <p class="mt-4 text-brand-brown font-medium">Подключение...</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithCustomToken, 
      signInAnonymously, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      getDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot, 
      query 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Конфигурация Firebase ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyBG_1ZBE4kd_6cy79fWlycPnE8lsX5p42s",
          authDomain: "vn-buffet.firebaseapp.com",
          projectId: "vn-buffet",
          storageBucket: "vn-buffet.firebasestorage.app",
          messagingSenderId: "796549505290",
          appId: "1:796549505290:web:5cd49810ce9a2235649af3"
        };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-buffet-app';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let state = {
      screen: 'login', // 'login', 'guest_menu', 'admin_panel'
      tableNumber: null,
      menuData: null,
      inventory: {},
      customNames: {},
      activeCategoryId: '',
      activeSubcategoryId: '',
      cart: {},
      orders: [],
      adminTab: 'new',
      selectedBillOrder: null,
      selectedAdminTable: null,
      showConfirmOrderModal: false,
      showGuestHistoryModal: false,
      showNoStockModal: false,
      user: null,
      isSubmittingOrder: false,

      // Флаг отслеживания загрузки остатков, чтобы избежать скачков интерфейса
      isInventoryLoaded: false,

      securityModal: null,
      securityPassword: '',
      securityError: false,
      
      confirmModal: null,

      showLigoLogo: false, 
    };

    // --- Системные константы ---
    const ADMIN_PASSWORD = "56165616";
    const SECURITY_PASSWORD_RESTRICTED = "0000"; // Пароль для доступа к Остаткам и Архиву
    const MIN_TABLE = 1;
    const MAX_TABLE = 50; 
    const DEFAULT_STOCK = 1; // По умолчанию даем 1 порцию на склад в памяти, если записи в БД нет
    let headerTimer = null;

    const ordersCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
    const inventoryCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory');
    const namesCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'menu_names');

    window.addToCart = addToCart;
    window.removeFromCart = removeFromCart;
    window.clearCart = clearCart;
    window.handleGuestLogin = handleGuestLogin;
    window.handleAdminLogin = handleAdminLogin;
    window.checkOrderBeforeSubmit = checkOrderBeforeSubmit;
    window.submitOrder = submitOrder;
    window.updateOrderStatus = updateOrderStatus;
    window.payAllOrdersForTable = payAllOrdersForTable;
    window.deleteOrder = deleteOrder;
    window.openBill = openBill;
    window.closeBillModal = closeBillModal;
    window.printBill = printBill;
    window.changeCategory = changeCategory;
    window.changeSubcategory = changeSubcategory;
    window.closeConfirmOrderModal = closeConfirmOrderModal;
    window.toggleGuestHistoryModal = toggleGuestHistoryModal;
    window.closeNoStockModal = closeNoStockModal;
    window.logout = logout;
    window.requestBillPayment = requestBillPayment;
    window.switchAdminTab = switchAdminTab;
    window.selectAdminTable = selectAdminTable;
    window.closeAdminTableModal = closeAdminTableModal;
    window.handleHeaderImageError = handleHeaderImageError;
    window.handleLoginImageError = handleLoginImageError;

    window.setStockZero = setStockZero;
    window.handleManualStockInput = handleManualStockInput;

    window.handleSecuritySubmit = handleSecuritySubmit;
    window.closeSecurityModal = closeSecurityModal;
    window.closeConfirmModal = closeConfirmModal;
    window.triggerConfirmAction = triggerConfirmAction;
    window.requestDeleteAllArchive = requestDeleteAllArchive;
    window.updateSecurityPasswordVal = updateSecurityPasswordVal;

    function showNotification(message, type = 'info') {
      console.log(`[${type.toUpperCase()}] ${message}`);
    }

    function getItemName(item) {
      if (!item) return '';
      return state.customNames[item.id] || item.name;
    }

    function handleLoginImageError(imgElement) {
      console.warn("Изображение logo.jpg на странице входа не загрузилось. Заменяем на иконку.");
      const fallbackContainer = document.getElementById('login-logo-fallback');
      if (fallbackContainer && imgElement) {
        imgElement.style.display = 'none';
        fallbackContainer.style.display = 'inline-flex';
      }
    }

    function handleHeaderImageError(imgElement) {
      console.warn("Изображение logo.jpg не найдено или не загрузилось. Смена шапки остановлена.");
      if (headerTimer) {
        clearInterval(headerTimer);
        headerTimer = null;
      }
      state.showLigoLogo = false;

      const textEl = document.getElementById('header-text');
      const imgEl = document.getElementById('header-image');
      if (textEl) {
        textEl.classList.remove('slide-out-right', 'pointer-events-none');
        textEl.classList.add('slide-in-left');
      }
      if (imgEl) {
        imgEl.classList.remove('slide-in-left');
        imgEl.classList.add('slide-out-right', 'pointer-events-none');
      }
    }

    async function initApp() {
      try {

        const response = await fetch(`menu.json?t=${Date.now()}`, {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });
        
        if (!response.ok) throw new Error('Не удалось загрузить menu.json');
        state.menuData = await response.json();
        
        if (state.menuData && state.menuData.categories.length > 0) {
          state.activeCategoryId = state.menuData.categories[0].id;
          const firstCat = state.menuData.categories[0];
          if (firstCat.subcategories && firstCat.subcategories.length > 0) {
            state.activeSubcategoryId = firstCat.subcategories[0].id;
          } else {
            state.activeSubcategoryId = '';
          }
        }

        const initAuth = async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        };
        await initAuth();

        onAuthStateChanged(auth, (firebaseUser) => {
          state.user = firebaseUser;
          if (firebaseUser) {
            subscribeToOrders();
            subscribeToInventory();
            subscribeToCustomNames();
          }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const tableParam = urlParams.get('table');
        const adminParam = urlParams.get('admin');

        if (adminParam === 'true') {
          state.screen = 'admin_panel';
          localStorage.setItem('bufet_role', 'admin');
          showNotification('Успешный вход сотрудника', 'success');
        } else if (tableParam) {
          const tableNum = parseInt(tableParam, 10);
          if (tableNum >= MIN_TABLE && tableNum <= MAX_TABLE) {
            state.tableNumber = tableNum;
            state.screen = 'guest_menu';
            localStorage.setItem('bufet_role', 'guest');
            localStorage.setItem('bufet_table', tableNum);
          }
        } else {

          const savedRole = localStorage.getItem('bufet_role');
          const savedTable = localStorage.getItem('bufet_table');

          if (savedRole === 'admin') {
            state.screen = 'admin_panel';
            showNotification('Восстановлена сессия сотрудника', 'success');
          } else if (savedRole === 'guest' && savedTable) {
            state.tableNumber = parseInt(savedTable, 10);
            state.screen = 'guest_menu';
            showNotification(`Стол №${savedTable}. Добро пожаловать назад!`, 'success');
          }
        }

        if (headerTimer) clearInterval(headerTimer);
        headerTimer = setInterval(() => {
          state.showLigoLogo = !state.showLigoLogo;
          const textEl = document.getElementById('header-text');
          const imgEl = document.getElementById('header-image');
          if (textEl && imgEl) {
            if (state.showLigoLogo) {

              textEl.classList.remove('slide-in-left');
              textEl.classList.add('slide-out-right', 'pointer-events-none');
              
              imgEl.classList.remove('slide-out-right', 'pointer-events-none');
              imgEl.classList.add('slide-in-left');
            } else {

              imgEl.classList.remove('slide-in-left');
              imgEl.classList.add('slide-out-right', 'pointer-events-none');
              
              textEl.classList.remove('slide-out-right', 'pointer-events-none');
              textEl.classList.add('slide-in-left');
            }
          }
        }, 5000); // Таймер для периодической смены шапки КАРТИНКА / ТЕКСТ

        render();
      } catch (error) {
        console.error(error);
        document.getElementById('app').innerHTML = `
          <div class="p-8 text-center flex flex-col justify-center items-center min-h-screen animate-fade-in">
            <i data-lucide="alert-triangle" class="w-16 h-16 text-red-500 mb-4"></i>
            <h2 class="text-xl font-bold text-brand-dark mb-2">Ошибка подключения</h2>
            <p class="text-brand-brown text-sm mb-6">Убедитесь, что файл <strong>menu.json</strong> лежит в той же папке, что и index.html.</p>
            <button onclick="location.reload()" class="bg-brand-peach text-white font-bold py-2 px-6 rounded-xl hover:bg-brand-brown transition">Повторить попытку</button>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function subscribeToOrders() {
      if (!state.user) return;
      const q = query(ordersCollectionRef);

      onSnapshot(q, (snapshot) => {
        const fetchedOrders = [];
        snapshot.forEach((doc) => {
          fetchedOrders.push({ id: doc.id, ...doc.data() });
        });

        fetchedOrders.sort((a, b) => {
          const aWait = a.waitingForPay ? 1 : 0;
          const bWait = b.waitingForPay ? 1 : 0;
          if (aWait !== bWait) {
            return bWait - aWait;
          }
          return new Date(b.timestamp) - new Date(a.timestamp);
        });

        state.orders = fetchedOrders;
        render();
      }, (error) => {
        console.error("Ошибка при чтении Firestore (заказы):", error);
      });
    }

    function subscribeToInventory() {
      if (!state.user) return;
      const q = query(inventoryCollectionRef);

      onSnapshot(q, (snapshot) => {
        const stockData = {};
        snapshot.forEach((doc) => {
          stockData[doc.id] = doc.data().stock;
        });

        state.inventory = stockData;
        state.isInventoryLoaded = true; // Фиксируем, что данные загружены
        render();
      }, (error) => {
        console.error("Ошибка при чтении Firestore (остатки):", error);
      });
    }

    function subscribeToCustomNames() {
      if (!state.user) return;
      const q = query(namesCollectionRef);

      onSnapshot(q, (snapshot) => {
        const customNamesData = {};
        snapshot.forEach((doc) => {
          customNamesData[doc.id] = doc.data().name;
        });
        state.customNames = customNamesData;
        render();
      }, (error) => {
        console.error("Ошибка при чтении Firestore (названия блюд):", error);
      });
    }

    async function handleManualStockInput(stockId, value) {
      if (!state.user) return;
      
      let parsed = parseInt(value.replace(/\D/g, ''), 10);
      
      if (isNaN(parsed) || parsed < 0) {
        parsed = 0;
      }
      if (parsed > 999) {
        parsed = 999;
      }

      try {
        const itemDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory', stockId);
        await setDoc(itemDocRef, { stock: parsed }, { merge: true });
        showNotification(`Остаток установлен: ${parsed} порц.`, 'success');
      } catch (error) {
        console.error("Ошибка записи ручного ввода остатка:", error);
        showNotification('Ошибка обновления остатка', 'error');
      }
    }

    async function setStockZero(stockId) {
      if (!state.user) return;
      try {
        const itemDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory', stockId);
        await setDoc(itemDocRef, { stock: 0 }, { merge: true });
        showNotification('Позиция переведена в стоп-лист', 'info');
      } catch (error) {
        console.error("Ошибка добавления в стоп-лист:", error);
      }
    }

    function getStockUsageInCart(stockId) {
      let usage = 0;
      Object.entries(state.cart).forEach(([cartItemId, count]) => {
        const cartItem = findMenuItem(cartItemId);
        if (cartItem) {
          const itemStockId = cartItem.stockLinkId || cartItem.id;
          if (itemStockId === stockId) {
            const factor = cartItem.portionWeight !== undefined ? cartItem.portionWeight : 1;
            usage += (count * factor);
          }
        }
      });
      return usage;
    }

    function addToCart(itemId) {
      if (state.isSubmittingOrder) return;

      const item = findMenuItem(itemId);
      if (!item) return;

      const stockId = item.stockLinkId || item.id;
      const currentStock = state.inventory[stockId] !== undefined ? state.inventory[stockId] : DEFAULT_STOCK;
      
      const portionWeight = item.portionWeight !== undefined ? item.portionWeight : 1;
      const currentUsageInCart = getStockUsageInCart(stockId);

      if (currentUsageInCart + portionWeight > currentStock) {
        state.showNoStockModal = true;
        render();
        return;
      }

      state.cart[itemId] = (state.cart[itemId] || 0) + 1;
      render();
    }

    function closeNoStockModal() {
      state.showNoStockModal = false;
      render();
    }

    function switchAdminTab(tabName) {
      if (tabName === 'inventory' || tabName === 'archive') {
        state.securityModal = { targetTab: tabName };
        state.securityPassword = '';
        state.securityError = false;
        render();

        setTimeout(() => {
          const input = document.getElementById('securityPasswordInput');
          if (input) input.focus();
        }, 100);
      } else {
        state.adminTab = tabName;
        state.selectedAdminTable = null;
        render();
      }
    }

    function updateSecurityPasswordVal(val) {
      state.securityPassword = val;
      if (val.length === 4) {
        handleSecuritySubmit();
      }
    }

    function handleSecuritySubmit(event) {
      if (event) event.preventDefault();
      
      if (state.securityPassword === SECURITY_PASSWORD_RESTRICTED) {
        const target = state.securityModal.targetTab;
        state.adminTab = target;
        state.securityModal = null;
        state.securityError = false;
        state.selectedAdminTable = null;
        showNotification('Доступ разрешен', 'success');
        render();
      } else {
        state.securityError = true;
        state.securityPassword = '';
        render();
        setTimeout(() => {
          const input = document.getElementById('securityPasswordInput');
          if (input) {
            input.value = '';
            input.focus();
          }
        }, 100);
      }
    }

    function closeSecurityModal() {
      state.securityModal = null;
      state.securityError = false;
      render();
    }

    function closeConfirmModal() {
      state.confirmModal = null;
      render();
    }

    function triggerConfirmAction() {
      if (state.confirmModal && typeof state.confirmModal.onConfirm === 'function') {
        state.confirmModal.onConfirm();
      }
      closeConfirmModal();
    }

    function selectAdminTable(tableNum) {
      state.selectedAdminTable = String(tableNum);
      render();
    }

    function closeAdminTableModal() {
      state.selectedAdminTable = null;
      render();
    }

    function removeFromCart(itemId) {
      if (state.isSubmittingOrder) return;

      if (state.cart[itemId]) {
        state.cart[itemId] -= 1;
        if (state.cart[itemId] === 0) {
          delete state.cart[itemId];
        }
      }
      if (getCartCount() === 0) {
        state.showConfirmOrderModal = false;
      }
      render();
    }

    function clearCart() {
      if (state.isSubmittingOrder) return;
      state.cart = {};
      state.showConfirmOrderModal = false;
      render();
    }

    function findMenuItem(itemId) {
      if (!state.menuData || !state.menuData.categories) return null;
      for (const category of state.menuData.categories) {
        const item = category.items.find(i => i.id === itemId);
        if (item) return item;
      }
      return null;
    }

    function getCartTotal() {
      return Object.entries(state.cart).reduce((total, [itemId, count]) => {
        const item = findMenuItem(itemId);
        return total + (item ? item.price * count : 0);
      }, 0);
    }

    function getCartCount() {
      return Object.values(state.cart).reduce((a, b) => a + b, 0);
    }

    function generateBillItemsMarkup(items) {
      return items.map(item => {
        const originalItem = findMenuItem(item.id);
        const displayName = originalItem ? getItemName(originalItem) : item.name;
        
        return `
          <div class="flex justify-between items-center text-xs py-2 border-b border-brand-brown/10">
            <span class="text-brand-dark font-medium">${displayName}</span>
            <div class="text-right flex items-center gap-2 flex-shrink-0">
              <span class="text-brand-peach font-bold">x${item.count}</span>
              <span class="text-brand-brown font-semibold w-12 text-right">${item.price * item.count} ₽</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeCategory(catId) {
      state.activeCategoryId = catId;
      
      const category = state.menuData && state.menuData.categories 
        ? state.menuData.categories.find(c => c.id === catId) 
        : null;

      if (category && category.subcategories && category.subcategories.length > 0) {
        state.activeSubcategoryId = category.subcategories[0].id;
      } else {
        state.activeSubcategoryId = '';
      }

      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function changeSubcategory(subId) {
      state.activeSubcategoryId = subId;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function requestBillPayment() {
      if (!state.user || !state.tableNumber) return;
      
      const myActiveOrders = state.orders.filter(
        order => String(order.table) === String(state.tableNumber) && order.status !== 'paid'
      );

      if (myActiveOrders.length === 0) {
        showNotification("У вас нет активных неоплаченных заказов", "error");
        return;
      }

      try {
        myActiveOrders.forEach(async (order) => {
          const orderDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', order.id);
          await updateDoc(orderDocRef, { waitingForPay: true });
        });
        showNotification("Запрос на расчет отправлен. Официант скоро подойдет!", "success");
        state.showGuestHistoryModal = false;
        render();
      } catch (error) {
        console.error("Ошибка при отправке запроса оплаты:", error);
        showNotification("Не удалось отправить запрос расчета", "error");
      }
    }

    function closeConfirmOrderModal() {
      if (state.isSubmittingOrder) return;
      state.showConfirmOrderModal = false;
      render();
    }

    function toggleGuestHistoryModal(value) {
      state.showGuestHistoryModal = value;
      render();
    }

    function logout() {
      localStorage.removeItem('bufet_role');
      localStorage.removeItem('bufet_table');
      state.screen = 'login';
      state.tableNumber = null;
      state.cart = {};
      state.selectedAdminTable = null;
      render();
    }

    function handleGuestLogin(event) {
      event.preventDefault();
      const inputVal = document.getElementById('tableInput').value;
      const tableNum = parseInt(inputVal, 10);

      if (tableNum >= MIN_TABLE && tableNum <= MAX_TABLE) {
        state.tableNumber = tableNum;
        state.screen = 'guest_menu';
        localStorage.setItem('bufet_role', 'guest');
        localStorage.setItem('bufet_table', tableNum);
        render();
      } else {
        showNotification(`Пожалуйста, введите номер стола от ${MIN_TABLE} до ${MAX_TABLE}`, 'error');
      }
    }

    function handleAdminLogin(event) {
      event.preventDefault();
      const passInput = document.getElementById('passwordInput').value;

      if (passInput === ADMIN_PASSWORD) {
        state.screen = 'admin_panel';
        localStorage.setItem('bufet_role', 'admin');
        render();
      } else {
        showNotification('Неверный пароль администратора!', 'error');
      }
    }

    function checkOrderBeforeSubmit() {
      if (Object.keys(state.cart).length === 0) return;
      state.showConfirmOrderModal = true;
      render();
    }

    async function submitOrder() {
      if (Object.keys(state.cart).length === 0) return;
      if (state.isSubmittingOrder) return;

      if (!state.user) {
        showNotification("Сбой подключения. Авторизация будет перезапущена...", "error");
        return;
      }

      state.isSubmittingOrder = true;
      render();

      try {
        const totalDeductions = {};
        for (const [itemId, count] of Object.entries(state.cart)) {
          const item = findMenuItem(itemId);
          if (item) {
            const stockId = item.stockLinkId || item.id;
            const factor = item.portionWeight !== undefined ? item.portionWeight : 1;
            totalDeductions[stockId] = (totalDeductions[stockId] || 0) + (count * factor);
          }
        }

        for (const [stockId, neededPortions] of Object.entries(totalDeductions)) {
          const currentStock = state.inventory[stockId] !== undefined ? state.inventory[stockId] : DEFAULT_STOCK;
          if (neededPortions > currentStock) {
            showNotification(`Недостаточно порций на складе! Требуется: ${neededPortions}, доступно: ${currentStock}.`, 'error');
            state.isSubmittingOrder = false;
            render();
            return;
          }
        }

        const orderItems = Object.entries(state.cart).map(([itemId, count]) => {
          const item = findMenuItem(itemId);
          return {
            id: itemId,
            name: getItemName(item), 
            price: Number(item.price),
            count: Number(count)
          };
        });

        const tableString = String(state.tableNumber);

        const newOrder = {
          table: tableString,
          items: orderItems,
          status: 'new',
          timestamp: new Date().toISOString(),
          total: Number(getCartTotal())
        };

        for (const [stockId, neededPortions] of Object.entries(totalDeductions)) {
          const currentStock = state.inventory[stockId] !== undefined ? state.inventory[stockId] : DEFAULT_STOCK;
          const updatedStock = Math.max(0, currentStock - neededPortions);
          const itemDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'inventory', stockId);
          await setDoc(itemDocRef, { stock: updatedStock }, { merge: true });
        }

        await addDoc(ordersCollectionRef, newOrder);
        
        state.cart = {};
        state.showConfirmOrderModal = false;
        
        showNotification("Заказ успешно отправлен на кухню!", "success");
      } catch (error) {
        console.error("Ошибка сохранения заказа в Firestore:", error);
        showNotification("Ошибка отправки заказа. Попробуйте еще раз.", "error");
      } finally {
        state.isSubmittingOrder = false;
        render();
      }
    }

    function payAllOrdersForTable(tableNum) {
      if (!state.user) return;

      const activeTableOrders = state.orders.filter(
        order => String(order.table) === String(tableNum) && order.status !== 'paid'
      );
      if (activeTableOrders.length === 0) return;

      let totalAmount = activeTableOrders.reduce((acc, o) => acc + o.total, 0);

      state.confirmModal = {
        title: 'Оплатить весь стол?',
        text: `Вы действительно хотите принять оплату и закрыть стол №${tableNum}? Все активные заказы стола будут объединены в один чек на сумму ${totalAmount} ₽.`,
        onConfirm: async () => {
          const combinedItemsMap = {};
          let totalAmountCombined = 0;

          activeTableOrders.forEach(order => {
            order.items.forEach(item => {
              if (combinedItemsMap[item.id]) {
                combinedItemsMap[item.id].count += item.count;
              } else {
                combinedItemsMap[item.id] = { ...item };
              }
            });
            totalAmountCombined += order.total;
          });

          const combinedOrderId = 'ord_comb_' + Date.now();
          const combinedPaidOrder = {
            table: String(tableNum),
            items: Object.values(combinedItemsMap),
            status: 'paid',
            timestamp: new Date().toISOString(),
            total: totalAmountCombined
          };

          try {
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', combinedOrderId), combinedPaidOrder);

            for (const order of activeTableOrders) {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', order.id));
            }

            state.selectedAdminTable = null;
            showNotification(`Все заказы стола №${tableNum} успешно объединены и оплачены!`, 'success');
          } catch (error) {
            console.error("Ошибка при оплате стола:", error);
            showNotification("Ошибка сети при проведении оплаты", "error");
          }
        }
      };
      render();
    }

            const stockItemsList = [];

            state.menuData.categories.forEach(category => {
              category.items.forEach(item => {
                const stockId = item.stockLinkId || item.id;
                
                if (!processedStockIds.has(stockId)) {
                  processedStockIds.add(stockId);

                  let subcategoryTitle = '';
                  if (category.subcategories && item.subcategory) {
                    const sub = category.subcategories.find(s => s.id === item.subcategory);
                    if (sub) {
                      subcategoryTitle = sub.title;
                    }
                  }

                  stockItemsList.push({
                    itemId: item.id,
                    stockId,
                    rawName: item.name,
                    categoryTitle: category.title,
                    subcategoryTitle: subcategoryTitle,
                    itemReference: item
                  });
                }
              });
            });

            const categoriesWithStocks = {};
            stockItemsList.forEach(stock => {
              if (!categoriesWithStocks[stock.categoryTitle]) {
                categoriesWithStocks[stock.categoryTitle] = [];
              }
              categoriesWithStocks[stock.categoryTitle].push(stock);
            });

            inventoryListHtml = Object.entries(categoriesWithStocks).map(([catTitle, stocks]) => {
              const itemsRows = stocks.map(stock => {
                const currentStockPortions = state.inventory[stock.stockId] !== undefined ? state.inventory[stock.stockId] : DEFAULT_STOCK;

                const isOutOfStock = currentStockPortions <= 0;
                const stopListBtnClass = isOutOfStock
                  ? 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100 hover:border-red-300'
                  : 'bg-white text-brand-dark border-brand-dark/20 hover:bg-brand-cream/20';

                const currentDisplayName = getItemName(stock.itemReference);

                return `
                  <div class="p-3 bg-brand-cream/10 rounded-xl border border-brand-brown/5 flex flex-col gap-2.5">
                    <div class="w-full">
                      <div class="p-1">
                        <h4 class="text-xs font-black text-brand-dark leading-tight">${currentDisplayName}</h4>
                        ${stock.subcategoryTitle ? `
                          <span class="text-[9px] bg-brand-peach/10 text-brand-peach px-1.5 py-0.2 rounded font-semibold mt-0.5 inline-block">
                            ${stock.subcategoryTitle}
                          </span>
                        ` : ''}
                      </div>
                    </div>
                    
                    <div class="flex items-center gap-1.5 w-full pt-1 border-t border-brand-brown/5">
                      <div class="flex items-center bg-white border border-brand-brown/20 rounded-lg px-2 py-1 gap-1 shadow-sm flex-1 justify-center">
                        <span class="text-[10px] text-brand-brown/60 font-semibold">Остаток:</span>
                        <input 
                          type="text" 
                          pattern="[0-9]*"
                          inputmode="numeric"
                          maxlength="3"
                          value="${currentStockPortions}"
                          onblur="handleManualStockInput('${stock.stockId}', this.value)"
                          onkeydown="if(event.key === 'Enter') { handleManualStockInput('${stock.stockId}', this.value); this.blur(); }"
                          class="w-10 h-6 text-center rounded bg-brand-cream/30 border border-brand-brown/10 focus:ring-1 focus:ring-brand-peach focus:outline-none text-xs font-black text-brand-dark"
                          title="Введите число порций на складе"
                        >
                        <span class="text-[9px] text-brand-dark font-black">порц.</span>
                      </div>

                      <button 
                        onclick="setStockZero('${stock.stockId}')" 
                        class="${stopListBtnClass} px-2.5 h-8 rounded-lg text-[10px] font-bold border flex items-center justify-center gap-1 flex-1"
                        title="Добавить всю позицию в стоп-лист (0 порций)"
                      >
                        <i data-lucide="slash" class="w-3 h-3"></i> Стоп-лист
                      </button>
                    </div>
                  </div>
                `;
              }).join('');

              let displayCatTitle = catTitle;
              if (displayCatTitle === 'Безалкогольные напитки') {
                displayCatTitle = 'Напитки';
              }

              return `
                <div class="bg-white p-4 rounded-2xl border border-brand-brown/10 shadow-sm space-y-3 animate-fade-in">
                  <h3 class="text-xs font-black text-brand-brown uppercase tracking-wider border-b border-brand-cream pb-1.5 flex items-center gap-1.5">
                    <i data-lucide="tag" class="w-3.5 h-3.5 text-brand-peach"></i>
                    ${displayCatTitle}
                  </h3>
                  <div class="space-y-2.5">
                    ${itemsRows}
                  </div>
                </div>
              `;
            }).join('');
          }

          ordersHtml = `
            <div class="space-y-4">
              ${inventoryListHtml}
            </div>
          `;
        }

        else if (state.adminTab === 'archive') {
          if (paidOrders.length === 0) {
            ordersHtml = `
              <div class="text-center py-20 px-4">
                <div class="w-16 h-16 bg-white/50 border border-brand-brown/10 rounded-full flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="archive" class="w-8 h-8 text-brand-brown/40"></i>
                </div>
                <h3 class="text-sm font-bold text-brand-dark">Архив пуст</h3>
                <p class="text-xs text-brand-brown/80 mt-1">Оплаченные счета будут архивироваться здесь.</p>
              </div>
            `;
          } else {
            const listHtml = paidOrders.map(order => {
              const formattedTime = new Date(order.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

              return `
                <div class="bg-white p-5 rounded-2xl border border-brand-brown/10 shadow-sm space-y-4">
                  <div class="flex justify-between items-start border-b border-brand-brown/15 pb-2">
                    <div>
                      <span class="bg-brand-brown text-brand-cream text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">Стол №${order.table}</span>
                      <span class="text-[10px] text-brand-brown/50 ml-2">${formattedTime}</span>
                    </div>
                    <div class="font-bold text-xs text-green-600 flex items-center gap-1 bg-green-50 px-2 py-0.5 rounded border border-green-100">
                      <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Оплачено
                    </div>
                  </div>
                  
                  <div class="space-y-1">
                    ${generateBillItemsMarkup(order.items)}
                  </div>
                  
                  <div class="flex justify-between items-center text-xs pt-3 border-t border-brand-brown/10">
                    <span class="text-[9px] text-brand-brown/50 font-medium">ID: ${order.id.replace('ord_comb_', '').substring(0, 8)}</span>
                    <span class="font-black text-brand-dark text-base">Итого: ${order.total} ₽</span>
                  </div>
                  
                  <div class="flex gap-2 pt-1.5 justify-end">
                    <button 
                      onclick="openBill('${order.id}')" 
                      class="text-brand-peach hover:text-brand-brown text-xs flex items-center gap-1 py-1 px-2 hover:bg-brand-cream rounded font-bold"
                    >
                      <i data-lucide="ruble" class="w-3.5 h-3.5"></i> Посмотреть чек
                    </button>
                    <button 
                      onclick="deleteOrder('${order.id}')" 
                      class="text-red-400 hover:text-red-600 text-xs flex items-center gap-1 py-1 px-2 hover:bg-red-50 rounded font-bold"
                    >
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Удалить
                    </button>
                  </div>
                </div>
              `;
            }).join('');

            ordersHtml = `
              <div class="space-y-4">
                ${listHtml}
                <div class="pt-4 pb-6">
                  <button 
                    onclick="requestDeleteAllArchive()" 
                    class="w-full bg-red-100 hover:bg-red-200 text-red-600 font-extrabold text-xs py-3.5 rounded-2xl transition flex items-center justify-center gap-2 border border-red-200 active:scale-[0.98] shadow-sm"
                  >
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Очистить весь архив
                  </button>
                </div>
              </div>
            `;
          }
        }

        const billModalHtml = state.selectedBillOrder ? `
          <div class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm z-50 flex items-start justify-center p-4 pb-24 overflow-y-auto">
            <div class="bg-brand-cream border-2 border-brand-brown p-5 rounded-3xl w-full max-w-sm shadow-2xl relative max-h-[80vh] flex flex-col justify-between my-4 animate-fade-in">
              <button onclick="closeBillModal()" class="absolute top-4 right-4 text-brand-brown hover:text-brand-dark z-20">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
              
              <div class="text-center pb-3 border-b border-brand-brown/15 flex-shrink-0">
                <span class="bg-brand-peach text-white text-xs font-black px-4 py-1 rounded-full uppercase">Счет на оплату</span>
                <p class="text-xs font-bold text-brand-brown mt-2.5">Стол №${state.selectedBillOrder.table}</p>
              </div>

              <div class="overflow-y-auto flex-1 my-3 pr-1">
                <div class="text-[10px] text-brand-brown/60 font-bold uppercase tracking-wider mb-2">Общий заказ стола:</div>
                <div class="space-y-1">
                  ${generateBillItemsMarkup(state.selectedBillOrder.items)}
                </div>
              </div>

              <div class="pt-3 border-t border-brand-brown/15 flex-shrink-0 space-y-4">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-bold text-brand-brown uppercase">Итого к оплате:</span>
                  <span class="text-lg font-black text-brand-peach">${state.selectedBillOrder.total} ₽</span>
                </div>

                <div class="flex-shrink-0">
                  <button 
                    onclick="closeBillModal()" 
                    class="w-full bg-brand-peach hover:bg-brand-brown text-white font-bold py-3 rounded-xl transition text-xs uppercase tracking-wider"
                  >
                    Закрыть
                  </button>
                </div>
              </div>
            </div>
          </div>
        ` : '';

        let tableDetailModalHtml = '';
        if (state.selectedAdminTable && groupedByTable[state.selectedAdminTable]) {
          const group = groupedByTable[state.selectedAdminTable];
          const isWaiting = group.waitingForPay;

          const orderTimestampsHtml = group.orders.map(o => {
            const time = new Date(o.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            return `<span class="bg-brand-cream text-brand-brown text-[10px] px-2 py-0.5 rounded font-bold">${time} (${o.total} ₽)</span>`;
          }).join(' ');

          tableDetailModalHtml = `
            <div class="fixed inset-0 bg-brand-dark/80 backdrop-blur-sm z-50 flex items-start justify-center p-4 pb-24 overflow-y-auto">
              <div class="bg-brand-cream border-2 border-brand-brown p-5 rounded-3xl w-full max-w-sm shadow-2xl relative max-h-[80vh] flex flex-col justify-between my-4 animate-fade-in">
                <button onclick="closeAdminTableModal()" class="absolute top-4 right-4 text-brand-brown hover:text-brand-dark z-20">
                  <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                
                <div class="flex-1 flex flex-col min-h-0">
                  <div class="text-center pb-3 border-b border-brand-brown/15 flex-shrink-0">
                    <span class="bg-brand-peach text-white text-xs font-black px-4 py-1 rounded-full uppercase">СТОЛ №${group.table}</span>
                    <div class="flex flex-wrap justify-center gap-1.5 mt-2.5">
                      ${orderTimestampsHtml}
                    </div>
                  </div>

                  <div class="overflow-y-auto flex-1 my-3 pr-1">
                    <div class="text-[10px] text-brand-brown/60 font-bold uppercase tracking-wider mb-2">Общий заказ стола:</div>
                    <div class="space-y-1">
                      ${generateBillItemsMarkup(Object.values(group.items))}
                    </div>
                  </div>
                </div>

                <div class="pt-3 border-t border-brand-brown/15 flex-shrink-0 space-y-3">
                  <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-brand-brown uppercase">Итого к оплате стола:</span>
                    <span class="text-lg font-black text-brand-peach">${group.total} ₽</span>
                  </div>

                  ${isWaiting ? `
                    <div class="text-center bg-red-50 text-red-600 text-xs font-extrabold py-2.5 px-3 rounded-xl border border-red-200 animate-pulse flex items-center justify-center gap-1.5">
                      <i data-lucide="credit-card" class="w-4 h-4 animate-bounce"></i> ГОСТЬ СТОЛА ПРОСИТ РАСЧЕТ!
                    </div>
                  ` : ''}

                  <div class="space-y-2">
                    <button 
                      onclick="payAllOrdersForTable('${group.table}')" 
                      class="w-full bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-3 rounded-xl flex items-center justify-center gap-1.5 transition shadow-md active:scale-95"
                    >
                      <i data-lucide="banknote" class="w-4 h-4"></i> Оплатить и закрыть стол
                    </button>
                    <button 
                      onclick="closeAdminTableModal()" 
                      class="w-full bg-white border border-brand-brown/20 text-brand-brown font-bold text-xs py-2.5 rounded-xl hover:bg-white/50 transition"
                    >
                      Назад к сетке столов
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        let securityModalHtml = '';
        if (state.securityModal) {
          const sectionTitle = state.securityModal.targetTab === 'inventory' ? 'ОСТАТКИ' : 'АРХИВ';
          securityModalHtml = `
            <div class="fixed inset-0 bg-brand-dark/95 backdrop-blur-md z-[100] flex items-center justify-center p-4">
              <div class="bg-brand-cream border-2 border-brand-peach p-6 rounded-3xl w-full max-w-xs shadow-2xl space-y-5 animate-fade-in text-center">
                <div class="mx-auto w-12 h-12 rounded-full bg-brand-peach/15 flex items-center justify-center text-brand-peach">
                  <i data-lucide="lock" class="w-6 h-6"></i>
                </div>
                
                <div>
                  <h3 class="text-sm font-black text-brand-dark uppercase tracking-wider">Защищенный раздел</h3>
                  <p class="text-[11px] text-brand-brown mt-1">Для входа в раздел <strong class="text-brand-peach">"${sectionTitle}"</strong> введите пин-код</p>
                </div>

                <form onsubmit="handleSecuritySubmit(event)" class="space-y-4">
                  <input 
                    type="password" 
                    id="securityPasswordInput" 
                    placeholder="••••" 
                    maxlength="4"
                    required
                    inputmode="numeric"
                    pattern="[0-9]*"
                    value="${state.securityPassword}"
                    oninput="updateSecurityPasswordVal(this.value)"
                    class="w-32 mx-auto text-center px-4 py-2.5 rounded-xl border ${state.securityError ? 'border-red-500 ring-2 ring-red-200 animate-shake' : 'border-brand-brown/20'} bg-white text-xl font-bold tracking-widest text-brand-dark focus:outline-none focus:ring-2 focus:ring-brand-peach"
                  >
                  
                  ${state.securityError ? `
                    <p class="text-[10px] font-bold text-red-600 animate-pulse">Неверный пин-код!</p>
                  ` : ''}

                  <div class="flex gap-2 pt-2">
                    <button 
                      type="button" 
                      onclick="closeSecurityModal()" 
                      class="flex-1 bg-white border border-brand-brown/20 text-brand-brown font-bold text-xs py-2.5 rounded-xl hover:bg-white/50 transition"
                    >
                      Отмена
                    </button>
                    <button 
                      type="submit" 
                      id="securityFormBtn"
                      class="flex-1 bg-brand-peach hover:bg-brand-brown text-white font-bold text-xs py-2.5 rounded-xl transition shadow-md"
                    >
                      Войти
                    </button>
                  </div>
                </form>
              </div>
            </div>
          `;
        }

        let confirmModalHtml = '';
        if (state.confirmModal) {
          confirmModalHtml = `
            <div class="fixed inset-0 bg-brand-dark/90 backdrop-blur-sm z-[110] flex items-center justify-center p-4">
              <div class="bg-brand-cream border-2 border-red-500 p-6 rounded-3xl w-full max-w-xs shadow-2xl space-y-4 animate-fade-in">
                <div class="flex items-center gap-2 border-b border-brand-brown/10 pb-2">
                  <i data-lucide="help-circle" class="text-red-500 w-5 h-5 flex-shrink-0"></i>
                  <h3 class="text-xs font-black text-brand-dark uppercase tracking-wide">${state.confirmModal.title}</h3>
                </div>
                
                <p class="text-[11px] text-brand-brown leading-relaxed font-medium">
                  ${state.confirmModal.text}
                </p>

                <div class="grid grid-cols-2 gap-2 pt-2">
                  <button 
                    onclick="closeConfirmModal()" 
                    class="bg-white border border-brand-brown/25 text-brand-brown font-bold text-xs py-2.5 rounded-xl hover:bg-white/60 transition"
                  >
                    ОТМЕНА
                  </button>
                  <button 
                    onclick="triggerConfirmAction()" 
                    class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-md active:scale-95"
                  >
                    ДА
                  </button>
                </div>
              </div>
            </div>
          `;
        }

        container.innerHTML = `
          <header class="bg-brand-dark text-brand-cream px-4 py-4 sticky top-0 z-20 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-2">
              <i data-lucide="terminal" class="w-5 h-5 text-brand-peach flex-shrink-0"></i>
              <div class="relative w-44 h-[49px] flex items-center overflow-hidden">
                <div id="header-text" class="absolute inset-y-0 left-0 flex flex-col justify-center w-full ${state.showLigoLogo ? 'slide-out-right pointer-events-none' : 'slide-in-left'}">
                  <h2 class="font-extrabold text-sm uppercase tracking-wide leading-tight">БУФЕТ</h2>
                  <p class="text-[10px] text-brand-cream/80 leading-tight">Панель сотрудника</p>
                </div>
                <div id="header-image" class="absolute inset-y-0 left-0 flex items-center w-full ${state.showLigoLogo ? 'slide-in-left' : 'slide-out-right pointer-events-none'}">
                  <img src="logo.jpg" class="h-[49px] w-auto object-contain rounded-lg shadow-md bg-white/10" alt="Logo" onerror="handleHeaderImageError(this)">
                </div>
              </div>
            </div>
            <button onclick="logout()" class="bg-brand-brown hover:bg-brand-peach text-white text-xs font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Выйти
            </button>
          </header>

          ${tabsHtml}

          <main class="flex-1 p-4 space-y-4 overflow-y-auto">
            ${ordersHtml}
          </main>

          ${billModalHtml}

          ${tableDetailModalHtml}

          ${securityModalHtml}

          ${confirmModalHtml}
        `;
      }

      lucide.createIcons();
    }

    window.onload = function() {
      initApp();
    };
  </script>
</body>
</html>
