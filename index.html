<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровое Меню & Управление</title>
    
    <!-- Подключение Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #e5aa70;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --danger-color: #cf6679;
            --success-color: #4caf50;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Стили Меню (Клиентская часть) */
        .category-section {
            margin-bottom: 30px;
        }

        .category-title {
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }

        .menu-item.out-of-stock {
            opacity: 0.4;
        }

        .item-info {
            flex: 1;
            padding-right: 15px;
        }

        .item-name {
            font-weight: bold;
            font-size: 1.1em;
        }

        .item-description {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-top: 4px;
        }

        .item-price {
            font-weight: bold;
            color: var(--primary-color);
            white-space: nowrap;
        }

        .status-badge {
            font-size: 0.8em;
            background-color: var(--danger-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            display: inline-block;
        }

        /* Стили Админки */
        .admin-section {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 4px;
        }

        .btn {
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .admin-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }

        .admin-item-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success-color);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .inline-edit-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--border-color);
            color: white;
            padding: 4px;
            font-size: 0.95em;
        }
        .inline-edit-input:focus {
            outline: none;
            border-bottom: 1px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Наше Заведение</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchPage('menu-page')">Меню</button>
            <button class="tab-btn" onclick="switchPage('admin-page')">Управление</button>
        </div>
    </header>

    <div class="container">
        <!-- СТРАНИЦА МЕНЮ (ДЛЯ КЛИЕНТОВ) -->
        <div id="menu-page" class="page active">
            <div id="menu-container">Загрузка меню...</div>
        </div>

        <!-- СТРАНИЦА АДМИНКИ (ДЛЯ ПЕРСОНАЛА) -->
        <div id="admin-page" class="page">
            <!-- Форма добавления нового блюда -->
            <div class="admin-section">
                <h3>Добавить новую позицию</h3>
                <form id="add-item-form" onsubmit="addNewItem(event)">
                    <div class="form-group">
                        <label>Категория</label>
                        <select id="new-item-category" class="form-control" onchange="updateSubcategoryVisibility()" required>
                            <option value="Кухня">Кухня</option>
                            <option value="Бар">Бар</option>
                        </select>
                    </div>
                    <div class="form-group" id="subcategory-group" style="display:none;">
                        <label>Подкатегория</label>
                        <select id="new-item-subcategory" class="form-control">
                            <option value="Напитки">Напитки</option>
                            <option value="Алкоголь">Алкоголь</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Название блюда / напитка</label>
                        <input type="text" id="new-item-name" class="form-control" placeholder="Например: Капучино" required>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <input type="text" id="new-item-desc" class="form-control" placeholder="Состав, объем, вес...">
                    </div>
                    <div class="form-group">
                        <label>Цена (руб.)</label>
                        <input type="number" id="new-item-price" class="form-control" placeholder="350" required>
                    </div>
                    <button type="submit" class="btn">Добавить в меню</button>
                </form>
            </div>

            <!-- Список позиций для быстрого редактирования остатков и цен -->
            <div class="admin-section">
                <h3>Редактор позиций и остатков</h3>
                <div id="admin-menu-list">Загрузка списка управления...</div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG: Замените на ваши актуальные ключи Firebase проекта
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Инициализация Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Переключение между вкладками
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
        }

        // Показ/скрытие подкатегорий в форме
        function updateSubcategoryVisibility() {
            const cat = document.getElementById('new-item-category').value;
            document.getElementById('subcategory-group').style.display = (cat === 'Бар') ? 'block' : 'none';
        }

        // Авто-инициализация базы данных из старого menu.json, если Firestore пуст
        async function checkAndInitDatabase(menuItems) {
            if (menuItems.length === 0) {
                try {
                    const response = await fetch('menu.json');
                    if (!response.ok) return;
                    const localData = await response.json();
                    
                    // Парсинг старого формата и пакетная загрузка в Firestore
                    const batch = db.batch();
                    
                    // Кухня
                    if (localData.Кухня) {
                        localData.Кухня.forEach(item => {
                            const docRef = db.collection('menu').doc();
                            batch.set(docRef, {
                                category: 'Кухня',
                                subcategory: '',
                                name: item.name,
                                description: item.description || '',
                                price: Number(item.price),
                                inStock: item.inStock !== undefined ? item.inStock : true,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });
                    }
                    // Бар (Напитки и Алкоголь)
                    if (localData.Бар) {
                        ['Напитки', 'Алкоголь'].forEach(subCat => {
                            if (localData.Бар[subCat]) {
                                localData.Бар[subCat].forEach(item => {
                                    const docRef = db.collection('menu').doc();
                                    batch.set(docRef, {
                                        category: 'Бар',
                                        subcategory: subCat,
                                        name: item.name,
                                        description: item.description || '',
                                        price: Number(item.price),
                                        inStock: item.inStock !== undefined ? item.inStock : true,
                                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                    });
                                });
                            }
                        });
                    }
                    await batch.commit();
                    console.log('База данных успешно инициализирована из menu.json');
                } catch (err) {
                    console.log('Локальный файл menu.json не найден или пуст. Начните заполнение с чистого листа.');
                }
            }
        }

        // ПОЛУЧЕНИЕ ДАННЫХ ИЗ FIRESTORE В РЕАЛЬНОМ ВРЕМЕНИ
        function subscribeToMenu() {
            db.collection('menu').orderBy('name').onSnapshot(snapshot => {
                const items = [];
                snapshot.forEach(doc => {
                    items.push({ id: doc.id, ...doc.data() });
                });

                // Если база данных пуста, пробуем мигрировать данные из старого JSON
                if (items.length === 0) {
                    checkAndInitDatabase(items);
                    return;
                }

                renderClientMenu(items);
                renderAdminMenu(items);
            });
        }

        // Отрисовка меню для клиентов
        function renderClientMenu(items) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            // Структурируем данные для отображения
            const categories = {
                'Кухня': { items: [] },
                'Бар - Напитки': { items: [] },
                'Бар - Алкоголь': { items: [] }
            };

            items.forEach(item => {
                if (item.category === 'Кухня') {
                    categories['Кухня'].items.push(item);
                } else if (item.category === 'Бар') {
                    const key = `Бар - ${item.subcategory || 'Напитки'}`;
                    if (categories[key]) categories[key].items.push(item);
                }
            });

            for (const [title, catData] of Object.entries(categories)) {
                if (catData.items.length === 0) continue;

                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `<h2 class="category-title">${title}</h2>`;

                catData.items.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = `menu-item ${!item.inStock ? 'out-of-stock' : ''}`;
                    itemEl.innerHTML = `
                        <div class="item-info">
                            <span class="item-name">${item.name} ${!item.inStock ? '<span class="status-badge">Закончилось</span>' : ''}</span>
                            <div class="item-description">${item.description || ''}</div>
                        </div>
                        <div class="item-price">${item.price} ₽</div>
                    `;
                    section.appendChild(itemEl);
                });

                container.appendChild(section);
            }
        }

        // Отрисовка панели управления для персонала
        function renderAdminMenu(items) {
            const container = document.getElementById('admin-menu-list');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<p>Меню пустое. Добавьте первую позицию выше.</p>';
                return;
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'admin-item-row';
                
                const catLabel = item.category === 'Бар' ? `${item.category} (${item.subcategory})` : item.category;

                row.innerHTML = `
                    <div style="flex: 1;">
                        <small style="color: var(--primary-color); block-size: auto;">${catLabel}</small>
                        <div>
                            <input type="text" class="inline-edit-input" value="${item.name}" style="font-weight:bold; width: 45%;" onchange="updateItemField('${item.id}', 'name', this.value)">
                            <input type="number" class="inline-edit-input" value="${item.price}" style="width: 20%; color: var(--primary-color);" onchange="updateItemField('${item.id}', 'price', Number(this.value))"> ₽
                        </div>
                        <div>
                            <input type="text" class="inline-edit-input" value="${item.description || ''}" placeholder="Добавить описание..." style="width: 80%; font-size:0.85em; color: var(--text-muted);" onchange="updateItemField('${item.id}', 'description', this.value)">
                        </div>
                    </div>
                    <div class="admin-item-actions">
                        <label class="toggle-switch">
                            <input type="checkbox" ${item.inStock ? 'checked' : ''} onchange="updateItemField('${item.id}', 'inStock', this.checked)">
                            <span class="slider"></span>
                        </label>
                        <button class="tab-btn btn-danger" style="padding: 5px 10px; border-radius: 4px; border: none;" onclick="deleteItem('${item.id}', '${item.name}')">✕</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Действие: Изменение любого поля в Firestore (название, цена, описание, наличие)
        function updateItemField(id, field, value) {
            db.collection('menu').doc(id).update({ [field]: value })
                .catch(err => alert("Ошибка обновления: " + err.message));
        }

        // Действие: Добавление новой позиции
        function addNewItem(e) {
            e.preventDefault();
            
            const category = document.getElementById('new-item-category').value;
            const subcategory = category === 'Бар' ? document.getElementById('new-item-subcategory').value : '';
            const name = document.getElementById('new-item-name').value.trim();
            const description = document.getElementById('new-item-desc').value.trim();
            const price = Number(document.getElementById('new-item-price').value);

            db.collection('menu').add({
                category: category,
                subcategory: subcategory,
                name: name,
                description: description,
                price: price,
                inStock: true,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                // Очистка формы
                document.getElementById('new-item-name').value = '';
                document.getElementById('new-item-desc').value = '';
                document.getElementById('new-item-price').value = '';
                alert(`Позиция "${name}" успешно добавлена!`);
            })
            .catch(err => alert("Ошибка добавления: " + err.message));
        }

        // Действие: Удаление позиции
        function deleteItem(id, name) {
            if (confirm(`Вы уверены, что хотите полностью удалить "${name}" из меню?`)) {
                db.collection('menu').doc(id).delete()
                    .catch(err => alert("Ошибка удаления: " + err.message));
            }
        }

        // Запуск подписки при загрузке страницы
        document.addEventListener('DOMContentLoaded', subscribeToMenu);
    </script>
</body>
</html>
